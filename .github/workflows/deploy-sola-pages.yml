name: Publicar SOLA no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "materialportopus/**"
      - ".github/workflows/deploy-sola-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar landing page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./materialportopus"

      - name: Aguardar propagação do artefato no GitHub
        run: |
          echo "Pacote enviado. Aguardando disponibilidade pela API antes do deploy."
          sleep 30

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
